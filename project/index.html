<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="VibeBoard - Visual Inspiration and Discovery">
    <title>VibeBoard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Outfit:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/main.css">
</head>
<body>

    <header class="glass-header">
        <h1>VibeBoard</h1>
        <div class="search-bar glass-element">
            <span class="icon">🔍</span>
            <input type="text" placeholder="Search inspiration..." aria-label="Search">
        </div>
    </header>

    <nav class="categories-scroll">
        <button class="chip active">All</button>
        <button class="chip glass-element">UI/UX</button>
        <button class="chip glass-element">Setups</button>
        <button class="chip glass-element">Cars</button>
        <button class="chip glass-element">Aviation</button>
    </nav>

    <main class="masonry-grid" id="pin-container">
        <figure class="pin glass-element">
            <img src="https://images.unsplash.com/photo-1558981806-ec527fa84c39?q=80&w=400&auto=format&fit=crop" alt="Motorcycle inspiration" loading="lazy">
            <figcaption>Cyberpunk Ride</figcaption>
        </figure>

        <figure class="pin glass-element">
            <img src="https://images.unsplash.com/photo-1541462608143-67571c6738dd?q=80&w=400&auto=format&fit=crop" alt="UI Design concept" loading="lazy">
            <figcaption>Clean App UI</figcaption>
        </figure>
        
        <figure class="pin glass-element">
            <img src="https://images.unsplash.com/photo-1517048676732-d65bc937f952?q=80&w=400&auto=format&fit=crop" alt="Workspace setup" loading="lazy">
            <figcaption>Dev Setup</figcaption>
        </figure>
    </main>

</body>
</html>
